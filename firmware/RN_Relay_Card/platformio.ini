; PlatformIO Project Configuration File
;
; Build:
;   pio run -e DMM_Card
;   pio run -e HSD_Card
;   pio run -e HV_Card
;   pio run -e Relay_Card
;
; Upload:
;   pio run -e DMM_Card -t upload

[platformio]
default_envs = DMM_Card

[common]
build_flags =
    -D HSE_VALUE=8000000U
    -Ilib/LwIP/src/include
    -Ilib/LwIP/system

[env]
platform = ststm32
board = RN_Relay_Card
framework = stm32cube
board_build.ldscript = ldscripts/STM32F407VETX_FLASH_384K.ld
board_upload.maximum_size = 393216
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
monitor_speed = 115200
lib_extra_dirs = lib
lib_ignore = LwIP
build_src_filter =
    +<*>
    +<../lib/LwIP/src/core/*.c>
    +<../lib/LwIP/src/core/ipv4/*.c>
    +<../lib/LwIP/src/netif/ethernet.c>

[env:DMM_Card]
build_flags =
    ${common.build_flags}
    -D RN_BOARD_TYPE_DMM_CARD
    -D RELAY_CHANNEL_COUNT=18U

[env:HSD_Card]
build_flags =
    ${common.build_flags}
    -D RN_BOARD_TYPE_HSD_CARD
    -D RELAY_CHANNEL_COUNT=15U

[env:HV_Card]
build_flags =
    ${common.build_flags}
    -D RN_BOARD_TYPE_HV_CARD
    -D RELAY_CHANNEL_COUNT=10U

[env:Relay_Card]
build_flags =
    ${common.build_flags}
    -D RN_BOARD_TYPE_RELAY_CARD
    -D RELAY_CHANNEL_COUNT=12U
