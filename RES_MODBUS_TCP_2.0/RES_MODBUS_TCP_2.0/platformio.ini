; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Resistor_Card]
platform = ststm32
board = black_f407ze
framework = stm32cube
board_build.ldscript = ldscripts/STM32F407ZETX_FLASH_384K.ld
board_upload.maximum_size = 393216
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
monitor_speed = 115200
lib_extra_dirs = lib
build_flags = 
    -D HSE_VALUE=8000000U
    -Ilib/LwIP/src/include
    -Ilib/LwIP/system
build_src_filter =
    +<*>
    +<../lib/LwIP/src/core/>
    +<../lib/LwIP/src/core/ipv4/>
    +<../lib/LwIP/src/api/>
    +<../lib/LwIP/src/netif/>
    +<../lib/LwIP/system/>

[env:Resistor_Card_30M]
extends = env:Resistor_Card
build_flags =
    ${env:Resistor_Card.build_flags}
    -D RELAY_RESISTANCE_PROFILE_30M
